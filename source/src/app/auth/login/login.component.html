<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
      <div class="card login-card shadow">
        <div class="card-header text-center">
          <div class="logo-container">
            <i class="fas fa-database logo-icon"></i>
            <h3 class="mb-0">DataScraper Pro</h3>
          </div>
          <p class="text-muted mt-2" style="color: white !important;">Accédez à votre tableau de bord</p>
        </div>

        <div class="card-body">
          <!-- Form Angular -->
          <form (ngSubmit)="submit()" [formGroup]="form">

            <!-- Username -->
            <div class="mb-4">
              <label class="form-label">Nom d'utilisateur</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Entrez votre nom d'utilisateur"
                  formControlName="username"
                />
              </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
              <label class="form-label">Mot de passe</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Entrez votre mot de passe"
                  formControlName="password"
                />
              </div>
            </div>

            <!-- Error message -->
            <div *ngIf="error" class="alert alert-danger py-2">
              {{ error }}
            </div>

            <!-- Submit button -->
            <button class="btn btn-primary w-100 login-btn" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              <i *ngIf="!loading" class="fas fa-sign-in-alt me-2"></i>
              Se connecter
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
