<nav *ngIf="auth.isLoggedIn()" class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-primary" routerLink="/">DataScraper Pro</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto" *ngIf="auth.isLoggedIn()">
        <li *ngIf="auth.isLoggedIn()  && (auth.getRole() == 'admin' || auth.getRole() == 'supervisor' ) " class="nav-item"><a class="nav-link" routerLink="/scraping" routerLinkActive="active">Scraping</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/historique" routerLinkActive="active">Historique</a></li>
      </ul>
      <div class="d-flex">
      
       
        <!-- Si connecté -->
        <button *ngIf="auth.isLoggedIn()" class="btn btn-danger me-2" (click)="deconnect()">Se déconnecter</button>
        <button *ngIf="auth.isLoggedIn()  && auth.getRole() == 'admin'" class="btn btn-primary" routerLink="/register">Gestion des utilisateurs</button>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  <router-outlet></router-outlet>
</div>
